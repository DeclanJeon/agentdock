name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    name: Bash smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Check Bash syntax
        run: bash -n bin/agentdock install.sh scripts/check-version.sh tests/*.sh

      - name: Check version metadata
        run: bash scripts/check-version.sh

      - name: Validate workspace fixtures
        run: python3 tests/fixtures/workspace/validate_workspace_fixtures.py

      - name: Run integration tests
        run: |
          for test_script in tests/*.sh; do
            echo "RUN ${test_script}"
            bash "${test_script}"
          done
