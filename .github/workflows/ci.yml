name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    name: Bash smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Check Bash syntax
        run: bash -n bin/agentdock install.sh tests/smoke.sh tests/workspace_p05.sh scripts/check-version.sh

      - name: Check version metadata
        run: bash scripts/check-version.sh

      - name: Run workspace contract test
        run: bash tests/workspace_p05.sh

      - name: Run smoke test
        run: bash tests/smoke.sh
