name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build release archive
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux zip

      - name: Verify
        run: |
          bash -n bin/agentdock install.sh tests/smoke.sh scripts/check-version.sh
          bash scripts/check-version.sh
          bash tests/smoke.sh

      - name: Package
        run: |
          pkg="agentdock-${GITHUB_REF_NAME}"
          mkdir -p "dist/${pkg}"
          cp -R README.md VERSION install.sh bin adapters tests scripts "dist/${pkg}/"
          tar -C dist -czf "dist/${pkg}.tar.gz" "${pkg}"
          (cd dist && zip -qr "${pkg}.zip" "${pkg}")
          (cd dist && sha256sum "${pkg}.tar.gz" "${pkg}.zip" > SHA256SUMS)

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: AgentDock ${{ github.ref_name }}
          body: |
            AgentDock ${{ github.ref_name }}

            Hermes-only tmux workrooms for local multi-agent coding teams.

            Install:

            ```bash
            curl -L -o agentdock-${{ github.ref_name }}.tar.gz https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/agentdock-${{ github.ref_name }}.tar.gz
            curl -L -o SHA256SUMS https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SHA256SUMS
            sha256sum -c SHA256SUMS
            tar -xzf agentdock-${{ github.ref_name }}.tar.gz
            cd agentdock-${{ github.ref_name }}
            ./install.sh --prefix "$HOME/.local"
            ```
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
