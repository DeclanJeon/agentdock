[package]
name = "agentdock-workspace"
version = "0.3.0"
description = "AgentDock Visual Office desktop app"
authors = ["AgentDock"]
edition = "2021"

[lib]
name = "agentdock_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
